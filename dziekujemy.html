<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dziękujemy — RSM365</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .thanks {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 2rem;
    background: var(--grad-dark); color: #fff;
  }
  .thanks-card { max-width: 480px; }
  .thanks-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(45, 212, 191, .15); color: var(--teal-400);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem; font-size: 2rem;
  }
  .thanks a.btn { margin-top: 1.5rem; }
</style>
</head>
<body>
  <section class="thanks">
    <div class="thanks-card">
      <div class="thanks-icon">✓</div>
      <h1>Dziękujemy za zgłoszenie!</h1>
      <p style="color: rgba(255,255,255,.8);">
        Otrzymaliśmy Twoją prośbę o rozmowę. Oddzwonimy dokładnie w wybranym terminie —
        do usłyszenia!
      </p>
      <a href="index.html#top" class="btn btn--primary">Wróć na stronę główną</a>
    </div>
  </section>
